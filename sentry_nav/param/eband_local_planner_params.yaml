#   eband_significant_force_lower_bound: 0.15
#   # 被认为是显著的力量的最小大小，并用于计算
#   costmap_weight: 15.0 #10.0
#   # 用于计算到障碍物距离的成本图权重因子

# # 轨迹控制器参数
#   max_vel_lin: 1.6 #1.8
#   # 最大线速度
#   max_vel_th: 0.1 #3.14
#   # 最大角速度
#   min_vel_lin: 0.1
#     # 最小线速度
