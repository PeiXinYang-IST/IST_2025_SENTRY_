#   marker_lifetime: 0.5
#   # eband可视化标记的生存时间

# # 弹性带参数
#   eband_min_relative_overlap: 0.7
#   # 表示相邻气泡之间连接的最小距离
#   eband_tiny_bubble_distance: 0.01
#   # 关于微小气泡距离的气泡几何界限
#   eband_tiny_bubble_expansion: 0.01
#   # 关于微小气泡扩展的气泡几何界限
#   eband_internal_force_gain: 1.0
#   # 相邻气泡之间拉伸弹性带的力量增益
#   eband_external_force_gain: 2.0
#   # 使气泡远离障碍物的力量增益
#   num_iterations_eband_optimization: 4 #3
#   # eband优化的迭代次数
